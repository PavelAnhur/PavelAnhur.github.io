<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630"
     viewBox="0 0 1200 630" role="img"
     aria-label="Pavel Anhur, QA Automation Engineer. I build test suites that catch regressions before release.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Soft accent glow, top-right -->
  <circle cx="1080" cy="80" r="300" fill="url(#glow)"/>

  <!-- Thin accent rule, top -->
  <rect x="0" y="0" width="1200" height="4" fill="#38bdf8"/>

  <!-- Header: name + role -->
  <text x="80" y="120"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="30" font-weight="600" fill="#f8fafc"
        letter-spacing="-0.01em">Pavel Anhur</text>

  <text x="80" y="162"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="22" font-weight="500" fill="#38bdf8"
        letter-spacing="0.02em">QA Automation Engineer</text>

  <!-- Divider -->
  <line x1="80" y1="200" x2="1120" y2="200" stroke="#1e293b" stroke-width="1"/>

  <!-- Hook line -->
  <text x="80" y="310"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="56" font-weight="700" fill="#f8fafc"
        letter-spacing="-0.02em">I build test suites that</text>
  <text x="80" y="382"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="56" font-weight="700" fill="#f8fafc"
        letter-spacing="-0.02em">catch regressions</text>
  <text x="80" y="454"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="56" font-weight="700" fill="#f8fafc"
        letter-spacing="-0.02em">before release.</text>

  <!-- Accent underline under "before release." -->
  <rect x="80" y="470" width="350" height="4" fill="#38bdf8"/>

  <!-- Footer strip: proof chips + url -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
     font-size="20" font-weight="500" fill="#94a3b8">

    <text x="80" y="555">250+ tests</text>
    <text x="240" y="555" fill="#475569">·</text>
    <text x="265" y="555">Allure report</text>
    <text x="450" y="555" fill="#475569">·</text>
    <text x="475" y="555">CI on every push</text>

    <text x="1120" y="555" text-anchor="end" fill="#38bdf8">pavelanhur.github.io</text>
  </g>
</svg>